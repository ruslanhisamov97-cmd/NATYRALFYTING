<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NaturalFytinf</title>
<style>
:root{color-scheme:dark;--bg:#080a10;--panel:#111522;--panel2:#181c2b;--red:#ff314b;--blue:#287bff;--white:#f4f6ff;--muted:#9ba3b8;--green:#37d46b;--danger:#7d2638}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--white)}button,input{font:inherit}button{cursor:pointer;border:0}.app{min-height:100vh;min-height:100dvh;background:radial-gradient(circle at 50% 30%,#182039 0,#080a10 55%);overflow:hidden}.screen{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;position:relative;padding:24px}.hidden{display:none!important}
.card{width:min(900px,94vw);background:rgba(17,21,34,.94);border:1px solid #2c3348;border-radius:24px;box-shadow:0 25px 80px #0008;padding:30px}.title{font-weight:1000;font-size:clamp(42px,9vw,86px);letter-spacing:-5px;text-align:center;margin:0 0 36px;text-transform:none}.title .r{color:var(--red);text-shadow:0 0 25px #ff314955}.title .b{color:var(--blue);text-shadow:0 0 25px #287bff55}.nameInput{display:block;width:min(430px,90%);margin:auto;padding:16px 20px;border-radius:14px;background:#090c14;border:1px solid #3a425a;color:white;outline:none;text-align:center;font-size:20px}.primary{display:block;margin:18px auto 0;padding:14px 38px;border-radius:14px;background:linear-gradient(135deg,var(--red),var(--blue));color:#fff;font-weight:900;font-size:19px;box-shadow:0 8px 30px #0007}.hint{text-align:center;color:var(--muted);font-size:13px;margin-top:12px}
.menu{align-items:stretch;justify-content:stretch;padding:20px}.menu-inner{width:min(1000px,96vw);margin:auto;min-height:calc(100vh - 40px);display:flex;flex-direction:column;align-items:center;position:relative}.gear{position:absolute;top:0;left:0;width:52px;height:52px;border-radius:15px;background:#1a2030;border:1px solid #343c55;color:white;font-size:27px}.hero-name{margin-top:45px;font-size:30px;font-weight:1000}.hero-stage{flex:1;display:flex;align-items:center;justify-content:center;width:100%;position:relative}.hero{width:190px;height:300px;border-radius:95px 95px 35px 35px;background:linear-gradient(135deg,#3e78ff,#161b2c 62%);border:4px solid #8fb0ff;box-shadow:0 0 55px #287bff44;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:86px;font-weight:1000}.hero img{width:100%;height:100%;object-fit:cover}.play{position:absolute;right:0;bottom:18px;padding:18px 44px;border-radius:17px;background:linear-gradient(135deg,#ff314b,#7d2030);font-weight:1000;color:white;font-size:20px}.progress{position:absolute;right:0;top:5px;color:#aeb6ca;font-size:14px}
.modalWrap{position:absolute;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}.modal{width:min(620px,94vw);max-height:90vh;overflow:auto;background:#111522;border:1px solid #384057;border-radius:22px;padding:25px;box-shadow:0 30px 100px #000}.modal h2{text-align:center;margin:0 0 18px}.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.level{padding:18px 8px;border-radius:14px;background:#1a2030;color:white;border:1px solid #343c55;font-weight:900}.level.locked{opacity:.35;cursor:not-allowed}.close{width:100%;margin-top:16px;padding:12px;border-radius:12px;background:#292f40;color:white}.settingRow{padding:12px 0;border-bottom:1px solid #292f40}.settingRow b{display:block;margin-bottom:5px}.devInput{width:100%;padding:13px;border-radius:12px;background:#090c14;border:1px solid #3a425a;color:white}.devPanel{margin-top:15px;padding:15px;border-radius:15px;background:#0c101a;border:1px solid #343c55}.upload{display:block;width:100%;padding:13px;margin:9px 0;border-radius:11px;background:#242b3e;color:#fff;text-align:center}.saveSettings{padding:12px 18px;border-radius:12px;background:var(--blue);color:#fff;font-weight:800}
.battle{padding:0}.battleTop{position:absolute;top:18px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:center;z-index:4}.back{padding:11px 14px;border-radius:12px;background:#1a2030;color:#fff}.bossName{font-size:28px;font-weight:1000;text-align:center}.hpBox{width:min(430px,42vw);background:#2a0d17;border:1px solid #5a2030;border-radius:12px;padding:7px}.hpBar{height:17px;background:#35101b;border-radius:8px;overflow:hidden}.hpFill{height:100%;background:linear-gradient(90deg,#ff3150,#ff7a39);transition:width .25s}.hpText{text-align:center;font-weight:900;margin-top:4px;font-size:12px}.battlefield{width:100%;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;position:relative;background:radial-gradient(circle at 50% 58%,#26304a,#0b0e17 55%)}.floor{position:absolute;left:0;right:0;bottom:0;height:24%;background:linear-gradient(180deg,#171c2a,#07090e);border-top:2px solid #31394d}.fighter{position:absolute;bottom:21%;width:150px;height:245px;border-radius:70px 70px 28px 28px;display:flex;align-items:center;justify-content:center;font-size:70px;font-weight:1000;z-index:2;transition:transform .08s}.fighter.player{left:18%;background:linear-gradient(135deg,#3679ff,#141a2c);border:4px solid #78a2ff}.fighter.boss{right:18%;background:linear-gradient(135deg,#a51d34,#22101a);border:4px solid #ff5a6e}.fighter img{width:100%;height:100%;object-fit:cover;border-radius:inherit}.shake{animation:shake .25s linear}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-9px) rotate(-2deg)}75%{transform:translateX(9px) rotate(2deg)}}
.timing{position:absolute;left:22px;top:28%;bottom:27%;width:44px;background:#541a29;border-radius:22px;border:2px solid #a32d46;overflow:hidden}.greenZone{position:absolute;left:0;right:0;top:37%;height:16%;background:var(--green);box-shadow:0 0 20px #37d46b88}.orb{position:absolute;left:50%;width:25px;height:25px;border-radius:50%;background:white;box-shadow:0 0 12px white;transform:translateX(-50%);z-index:3}.attackTrails{position:absolute;right:calc(18% + 165px);bottom:31%;display:flex;flex-direction:column;gap:12px}.trail{width:30px;height:52px;border-radius:7px;background:#6c1d2e;border:2px solid #9c2a42}.trail.active{background:#ff314b;box-shadow:0 0 22px #ff314b}.controls{position:absolute;left:28px;right:28px;bottom:28px;display:flex;justify-content:space-between;z-index:5}.bigBtn{padding:22px 52px;border-radius:18px;background:linear-gradient(135deg,#e62844,#7c182a);color:white;font-size:24px;font-weight:1000;box-shadow:0 10px 35px #0008}.dodge{background:linear-gradient(135deg,#2b7cff,#183b86)}
.result{text-align:center}.result h2{font-size:52px;margin:0 0 20px}.resultBtns{display:flex;gap:12px;justify-content:center}.resultBtns button{padding:14px 24px;border-radius:13px;font-weight:900;color:white}.again{background:#e52b46}.home{background:#273047}.next{background:#287bff}
@media(max-width:700px){.fighter{width:105px;height:175px;font-size:45px}.fighter.player{left:15%}.fighter.boss{right:13%}.attackTrails{right:calc(13% + 115px)}.timing{left:10px;width:35px}.bigBtn{padding:17px 27px;font-size:19px}.levels{grid-template-columns:repeat(2,1fr)}.hpBox{width:45vw}.bossName{font-size:20px}}
</style>
</head>
<body>
<div id="app" class="app">
<section id="register" class="screen">
  <div class="card">
    <h1 class="title"><span class="r">Natural</span><span class="b">Fytinf</span></h1>
    <input id="nickname" class="nameInput" maxlength="18" placeholder="Введите ник" autocomplete="off">
    <button id="registerBtn" class="primary">Играть</button>
    <div class="hint">Прогресс сохраняется в этом браузере под выбранным ником.</div>
  </div>
</section>
<section id="menu" class="screen menu hidden">
 <div class="menu-inner">
  <button class="gear" id="settingsBtn" title="Настройки">⚙️</button>
  <div class="progress" id="progressLabel"></div>
  <div class="hero-name">Егор</div>
  <div class="hero-stage"><div id="hero" class="hero">Е</div></div>
  <button class="play" id="menuPlay">Играть</button>
 </div>
</section>
<section id="battle" class="screen battle hidden">
 <div class="battleTop"><button class="back" id="battleHome">🏠</button><div><div id="bossName" class="bossName"></div><div class="hpBox"><div class="hpBar"><div id="hpFill" class="hpFill"></div></div><div id="hpText" class="hpText"></div></div></div><div style="width:50px"></div></div>
 <div class="battlefield"><div class="floor"></div><div id="timing" class="timing"><div class="greenZone"></div><div id="orb" class="orb"></div></div><div id="player" class="fighter player">Е</div><div id="boss" class="fighter boss">Б</div><div id="trails" class="attackTrails"><div class="trail"></div><div class="trail"></div><div class="trail"></div></div></div>
 <div class="controls"><button id="hitBtn" class="bigBtn">Бить</button><button id="dodgeBtn" class="bigBtn dodge">Уворот</button></div>
</section>
<div id="modalHost"></div>
</div>
<script>
const bosses=[
 {name:'Тимур',hp:50}, {name:'Говнянский',hp:100}, {name:'таранькина',hp:150}, {name:'ВлАдИчЕк',hp:200}, {name:'батек',hp:250}, {name:'Лариса',hp:500}, {name:'дед',hp:501}, {name:'жаба рудольфофна',hp:800}, {name:'EvilЕгор',hp:1000}
];
let state={nick:'',level:0,heroImage:'',bossImages:{},current:0,playerHearts:3,bossHp:0,orbPos:0,orbDir:1,attackTimer:null,attackActive:false,dodgeUsed:false,audio:null};
const $=id=>document.getElementById(id);
function storageKey(n){return 'NaturalFytinf:'+n.toLowerCase()}
function save(){const data=JSON.stringify({nick:state.nick,level:state.level,heroImage:state.heroImage,bossImages:state.bossImages});try{localStorage.setItem(storageKey(state.nick),data);localStorage.setItem('NaturalFytinf:lastNick',state.nick)}catch(e){window.__nfMemory=window.__nfMemory||{};window.__nfMemory[storageKey(state.nick)]=data;window.__nfMemory.lastNick=state.nick}}
function load(n){try{return JSON.parse(localStorage.getItem(storageKey(n)))||null}catch(e){try{return JSON.parse((window.__nfMemory||{})[storageKey(n)])||null}catch{return null}}}
function show(id){['register','menu','battle'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}
function music(){if(state.audio)return;const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=new C(),gain=c.createGain();gain.gain.value=.035;gain.connect(c.destination);let t=c.currentTime;const notes=[110,138.59,164.81,146.83,110,123.47,184.99,164.81];function beat(){if(!state.audio)return;const o=c.createOscillator();o.type='sawtooth';o.frequency.value=notes[Math.floor(Math.random()*notes.length)];const g=c.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.35,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+.22);o.connect(g);g.connect(gain);o.start(t);o.stop(t+.24);t+=.28;setTimeout(beat,250)}state.audio={c,gain};beat()}
function renderMenu(){ $('progressLabel').textContent=`Пройдено уровней: ${state.level} / 9`; if(state.heroImage)$('hero').innerHTML=`<img src="${state.heroImage}">`;else $('hero').textContent='Е'; }
function register(){const n=$('nickname').value.trim();if(!n)return $('nickname').focus();state.nick=n;const old=load(n);if(old)Object.assign(state,old);else save();music();renderMenu();show('menu')}
$('registerBtn').onclick=register;$('nickname').onkeydown=e=>{if(e.key==='Enter')register()};
$('menuPlay').onclick=()=>levelPicker();
function modal(html){$('modalHost').innerHTML=`<div class="modalWrap" id="modal"><div class="modal">${html}</div></div>`}
function closeModal(){$('modalHost').innerHTML=''}
function levelPicker(){let h='<h2>Выбор уровня</h2><div class="levels">';for(let i=0;i<9;i++){const unlocked=i<=state.level;h+=`<button class="level ${unlocked?'':'locked'}" ${unlocked?'':'disabled'} onclick="startLevel(${i})">уровень ${i+1}<br><small>${bosses[i].name}</small></button>`}h+='</div><button class="close" onclick="closeModal()">Закрыть</button>';modal(h)}
function settings(){modal(`<h2>Настройки</h2><div class="settingRow"><b>Ник игрока</b>${escapeHtml(state.nick)}</div><div class="settingRow"><b>Пройдено уровней</b>${state.level} / 9</div><div class="settingRow"><input id="devCode" class="devInput" placeholder=""></div><div id="devArea"></div><button class="close" onclick="closeModal()">Закрыть</button>`);$('devCode').oninput=e=>{if(e.target.value==='SikretРазрабABOBI')devPanel()}}
function devPanel(){if($('devArea').innerHTML)return;$('devArea').innerHTML=`<div class="devPanel"><b>Панель разработчика</b><label class="upload">Картинка 1 (Егор)<input type="file" accept="image/*" hidden onchange="uploadHero(this)"></label>${bosses.map((b,i)=>`<label class="upload">Картинка ${i+2} (${escapeHtml(b.name)})<input type="file" accept="image/*" hidden onchange="uploadBoss(this,${i})"></label>`).join('')}<small style="color:#9ba3b8">Изображения сохраняются локально в браузере и видны на этом устройстве.</small></div>`}
function uploadHero(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{state.heroImage=r.result;save();renderMenu()};r.readAsDataURL(f)}
function uploadBoss(inp,i){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{state.bossImages[i]=r.result;save();if(state.current===i)$('boss').innerHTML=`<img src="${r.result}">`};r.readAsDataURL(f)}
$('settingsBtn').onclick=settings;
function startLevel(i){closeModal();state.current=i;state.bossHp=bosses[i].hp;state.playerHearts=3;state.dodgeUsed=false;show('battle');$('bossName').textContent=bosses[i].name;$('hpText').textContent=`${state.bossHp} / ${bosses[i].hp} HP`;$('hpFill').style.width='100%';$('player').classList.remove('shake');$('boss').classList.remove('shake');$('boss').innerHTML=state.bossImages[i]?`<img src="${state.bossImages[i]}">`:'Б';startOrb();startBossAttack()}
function startOrb(){clearInterval(state.orbTimer);state.orbPos=0;state.orbDir=1;state.orbTimer=setInterval(()=>{state.orbPos+=state.orbDir*1.6;if(state.orbPos>100){state.orbPos=100;state.orbDir=-1}if(state.orbPos<0){state.orbPos=0;state.orbDir=1}$('orb').style.top=`${state.orbPos}%`},16)}
function startBossAttack(){clearTimeout(state.attackTimer);state.attackTimer=setTimeout(()=>{const trails=[...document.querySelectorAll('.trail')];trails.forEach(x=>x.classList.remove('active'));const idx=Math.floor(Math.random()*3);trails[idx].classList.add('active');state.attackActive=true;state.dodgeUsed=false;setTimeout(()=>{if(state.attackActive&&!state.dodgeUsed)takeHit();trails[idx].classList.remove('active');state.attackActive=false;startBossAttack()},1000)},1000+Math.random()*1300)}
function takeHit(){state.playerHearts--;shake($('player'));if(state.playerHearts<=0)finish(false)}
function shake(el){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')}
$('hitBtn').onclick=()=>{const p=state.orbPos;if(p>=37&&p<=53){state.bossHp=Math.max(0,state.bossHp-5);shake($('boss'));$('hpFill').style.width=(state.bossHp/bosses[state.current].hp*100)+'%';$('hpText').textContent=`${state.bossHp} / ${bosses[state.current].hp} HP`;if(state.bossHp===0)finish(true)}};
$('dodgeBtn').onclick=()=>{if(state.attackActive){state.dodgeUsed=true;shake($('player'));}}
$('battleHome').onclick=()=>{clearInterval(state.orbTimer);clearTimeout(state.attackTimer);renderMenu();show('menu')};
window.addEventListener('DOMContentLoaded',()=>{let last=null;try{last=localStorage.getItem('NaturalFytinf:lastNick')}catch(e){};last=last||((window.__nfMemory||{}).lastNick);if(last){const old=load(last);if(old){Object.assign(state,old);renderMenu();show('menu')}}})
function finish(win){clearInterval(state.orbTimer);clearTimeout(state.attackTimer);if(win){if(state.current===state.level)state.level++;save();renderMenu();modal(`<div class="result"><h2>Победа</h2><div class="resultBtns"><button class="home" onclick="closeModal();show('menu')">🏠</button>${state.current<8?'<button class="next" onclick="closeModal();startLevel('+(state.current+1)+')">Далее</button>':'<button class="next" onclick="closeModal();show(\'menu\')">Далее</button>'}</div></div>`)}else modal(`<div class="result"><h2>Поражение</h2><div class="resultBtns"><button class="home" onclick="closeModal();show('menu')">🏠</button><button class="again" onclick="closeModal();startLevel(${state.current})">Заново</button></div></div>`)}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
</script>
</body></html>
